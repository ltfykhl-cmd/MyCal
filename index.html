<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCal - متابعة السعرات</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1128">
    <style>
        :root {
            --bg-color: #0a1128;
            --card-bg: #101c2f;
            --accent: #00efff;
            --accent-gradient: linear-gradient(135deg, #00efff 0%, #0077ff 100%);
            --text-main: #ffffff;
            --text-muted: #8e9bb0;
            --danger: #ff4757;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { font-size: 1.4rem; color: var(--accent); }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid rgba(0,239,255,0.1); display: flex; flex-direction: column; gap: 12px; }
        
        .main-stat { display: flex; justify-content: space-between; align-items: center; }
        .calories-left { font-size: 2.2rem; font-weight: bold; }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; }
        .macros-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .macro-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .macro-value { font-size: 1.1rem; font-weight: bold; }
        
        label { font-size: 0.9rem; color: var(--text-muted); }
        input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: var(--text-main); font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }
        
        .btn-primary { background: var(--accent-gradient); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 1rem; text-align: center; }
        .btn-secondary { background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); padding: 12px; border-radius: 12px; cursor: pointer; text-align: center; font-weight: bold; }
        .food-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MyCal</h1>
        <div class="stat-label">تنشيف (1850 سعرة)</div>
    </header>

    <!-- Dashboard -->
    <div class="card">
        <div class="main-stat">
            <div>
                <div class="stat-label">المتبقي (سعرة)</div>
                <div class="calories-left" id="caloriesLeft">1850</div>
            </div>
            <div style="text-align: left;">
                <div class="stat-label">الهدف: 1850</div>
                <div class="stat-label">المستهلك: <span id="consumedCalories">0</span></div>
            </div>
        </div>
    </div>

    <div class="macros-grid">
        <div class="macro-box">
            <div class="stat-label">كربوهيدرات</div>
            <div class="macro-value"><span id="consumedCarb">0</span> / 210 غ</div>
        </div>
        <div class="macro-box">
            <div class="stat-label">بروتين</div>
            <div class="macro-value"><span id="consumedProtein">0</span> / 150 غ</div>
        </div>
    </div>

    <div class="card">
        <div class="stat-label">دهون</div>
        <div class="macro-value"><span id="consumedFat">0</span> / 55 غ</div>
    </div>

    <!-- Add Meal Form -->
    <div class="card">
        <h3 style="font-size: 1rem; color: var(--accent);">+ إضافة وجبة يدوية</h3>
        <div>
            <label>السعرات الحرارية:</label>
            <input type="number" id="manualCals" placeholder="مثال: 500">
        </div>
        <div>
            <label>الكارب (غرام):</label>
            <input type="number" id="manualCarb" placeholder="مثال: 50">
        </div>
        <div>
            <label>الدهون (غرام):</label>
            <input type="number" id="manualFat" placeholder="مثال: 15">
        </div>
        <div>
            <label>البروتين (غرام):</label>
            <input type="number" id="manualProtein" placeholder="مثال: 30">
        </div>
        <button class="btn-primary" onclick="addManualFood()">إضافة للوحة</button>
    </div>

    <!-- Today's Log -->
    <div class="card">
        <h3 style="font-size: 1.1rem; color: var(--accent);">وجبات اليوم</h3>
        <div id="mealsList" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="stat-label" style="text-align: center; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>
        </div>
    </div>
    
    <button class="btn-secondary" onclick="resetDay()">تصفير بيانات اليوم</button>
</div>

<script>
    let userState = JSON.parse(localStorage.getItem('mycal_clean_state')) || {
        goals: { cals: 1850, protein: 150, carb: 210, fat: 55 },
        consumed: { cals: 0, protein: 0, carb: 0, fat: 0 },
        meals: []
    };

    window.onload = function() {
        updateDashboard();
    }

    function updateDashboard() {
        const left = userState.goals.cals - userState.consumed.cals;
        document.getElementById('caloriesLeft').innerText = Math.max(0, left);
        document.getElementById('consumedCalories').innerText = userState.consumed.cals;

        document.getElementById('consumedCarb').innerText = userState.consumed.carb;
        document.getElementById('consumedProtein').innerText = userState.consumed.protein;
        document.getElementById('consumedFat').innerText = userState.consumed.fat;

        const list = document.getElementById('mealsList');
        if (userState.meals.length === 0) {
            list.innerHTML = `<div class="stat-label" style="text-align: center; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>`;
        } else {
            list.innerHTML = userState.meals.map((m, index) => `
                <div class="food-item">
                    <div>
                        <div style="font-weight: bold; font-size: 0.95rem;">${m.name}</div>
                        <div class="stat-label">P: ${m.p}غ | C: ${m.c}غ | F: ${m.f}غ</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="color: var(--accent); font-weight: bold;">${m.cals} سعرة</span>
                        <button onclick="deleteMeal(${index})" style="background: rgba(255,71,87,0.2); color: var(--danger); border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">حذف</button>
                    </div>
                </div>
            `).join('');
        }
    }

    function addManualFood() {
        const cals = parseInt(document.getElementById('manualCals').value) || 0;
        const carb = parseInt(document.getElementById('manualCarb').value) || 0;
        const fat = parseInt(document.getElementById('manualFat').value) || 0;
        const protein = parseInt(document.getElementById('manualProtein').value) || 0;

        if (cals > 0) {
            userState.meals.push({ name: 'وجبة مضافة', cals, c: carb, f: fat, p: protein });
            userState.consumed.cals += cals;
            userState.consumed.carb += carb;
            userState.consumed.fat += fat;
            userState.consumed.protein += protein;
            saveAndRefresh();
            clearInputs();
        }
    }

    function deleteMeal(index) {
        const m = userState.meals[index];
        userState.consumed.cals -= m.cals;
        userState.consumed.carb -= m.c;
        userState.consumed.fat -= m.f;
        userState.consumed.protein -= m.p;
        userState.meals.splice(index, 1);
        saveAndRefresh();
    }

    function resetDay() {
        userState.consumed = { cals: 0, protein: 0, carb: 0, fat: 0 };
        userState.meals = [];
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('mycal_clean_state', JSON.stringify(userState));
        updateDashboard();
    }

    function clearInputs() {
        document.getElementById('manualCals').value = '';
        document.getElementById('manualCarb').value = '';
        document.getElementById('manualFat').value = '';
        document.getElementById('manualProtein').value = '';
    }
</script>
</body>
</html>
