<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCal - حاسبة السعرات الذكية</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --bg-color: #0a1128;
            --card-bg: #101c3f;
            --accent-green: #00ffcc;
            --accent-blue: #0099ff;
            --text-color: #ffffff;
            --text-muted: #a0aec0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2a3b6c;
            background-color: #0a1128;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            color: #0a1128;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .result-box {
            margin-top: 20px;
            background-color: #0a1128;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a3b6c;
            text-align: center;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MyCal</h1>
        <div class="input-group">
            <label for="weight">الوزن (كجم):</label>
            <input type="number" id="weight" placeholder="مثال: 92.4">
        </div>
        <div class="input-group">
            <label for="goal">الهدف:</label>
            <select id="goal">
                <option value="cut">تنشيف (حرق دهون)</option>
                <option value="bulk">تضخيم</option>
                <option value="maintain">ثبات الوزن</option>
            </select>
        </div>
        <button onclick="calculate()">احسب سعراتك وبروتيناتك</button>

        <div class="result-box" id="result" style="display: none;">
            <h3>نتيجتك المخصصة</h3>
            <p id="caloriesText"></p>
            <p id="proteinText"></p>
        </div>
    </div>

    <script>
        function calculate() {
            const weight = parseFloat(document.getElementById('weight').value);
            const goal = document.getElementById('goal').value;
            
            if (!weight || weight <= 0) {
                alert('الرجاء إدخال وزن صحيح');
                return;
            }

            let calories = 2000;
            let protein = Math.round(weight * 1.8);

            if (goal === 'cut') {
                calories = 1850;
            } else if (goal === 'bulk') {
                calories = 2600;
            } else {
                calories = 2200;
            }

            document.getElementById('caloriesText').innerText = `السعرات المستهدفة: ${calories} سعرة حرارية`;
            document.getElementById('proteinText').innerText = `البروتين المستهدف: ${protein} جرام`;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
