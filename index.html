<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCal - متتبع اللياقة والسعرات</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 700;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* شريط الأيام الدائري */
        .days-bar {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .day-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex: 1;
            min-width: 45px;
        }

        .day-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: var(--bg-color);
            border: 2px solid var(--border);
            color: var(--text-muted);
            position: relative;
            transition: 0.3s;
        }

        .day-item.active .day-circle {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .day-item.completed .day-circle {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .day-name {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .day-item.active .day-name {
            color: var(--text-main);
            font-weight: bold;
        }

        /* بطاقة الملخص اليومي */
        .summary-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stat-box .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-box .value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        /* واجهة الإدخال الذكية */
        .ai-input-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-input-section h3 {
            font-size: 1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            resize: none;
            height: 80px;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        button.primary-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        /* قائمة الوجبات */
        .meals-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .meals-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .meal-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .meal-item {
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .meal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meal-name {
            font-weight: bold;
            color: var(--text-main);
        }

        .meal-macros {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MyCal Fitness</h1>
            <p>رحلة الـ 100 يوم - نشاط وتنشيف بذكاء</p>
        </header>

        <!-- شريط الأيام -->
        <div class="days-bar" id="daysBar">
            <!-- سيتم توليد الأيام برمجياً -->
        </div>

        <!-- الملخص اليومي -->
        <div class="summary-card">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">المستهلك</div>
                    <div class="value" id="totalCals">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">الهدف</div>
                    <div class="value">1900</div>
                </div>
                <div class="stat-box">
                    <div class="label">المتبقي</div>
                    <div class="value" id="remainingCals">1900</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">بروتين</div>
                    <div class="value" id="totalProtein">0g</div>
                </div>
                <div class="stat-box">
                    <div class="label">كارب</div>
                    <div class="value" id="totalCarbs">0g</div>
                </div>
                <div class="stat-box">
                    <div class="label">دهون</div>
                    <div class="value" id="totalFats">0g</div>
                </div>
            </div>
        </div>

        <!-- إدخال الوجبات الذكي -->
        <div class="ai-input-section">
            <h3>✨ إضافة وجبة بالذكاء الاصطناعي</h3>
            <textarea id="foodInput" placeholder="اكتب وجبتك هنا بالعربي (مثلاً: قطعتين خبز قمح مع بيضتين وهريسة)..."></textarea>
            <button class="primary-btn" onclick="parseAndAddMeal()">تحليل وإضافة الوجبة</button>
        </div>

        <!-- قائمة الوجبات المضافة -->
        <div class="meals-section">
            <h3>وجبات اليوم</h3>
            <div class="meal-list" id="mealList">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">لا توجد وجبات مضافة اليوم</div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الأيام (من السبت إلى الخميس أو أسبوعية)
        const days = [
            { id: 'sat', name: 'س' },
            { id: 'sun', name: 'ح' },
            { id: 'mon', name: 'ن' },
            { id: 'tue', name: 'ث' },
            { id: 'wed', name: 'ر' },
            { id: 'thu', name: 'خ' },
            { id: 'fri', name: 'ج' }
        ];

        let currentDayIndex = 1; // افتراضي الأحد كمثال
        let mealsData = JSON.parse(localStorage.getItem('mycal_meals') || '[]');

        function renderDays() {
            const bar = document.getElementById('daysBar');
            bar.innerHTML = '';
            days.forEach((day, index) => {
                const item = document.createElement('div');
                item.className = `day-item ${index === currentDayIndex ? 'active' : ''} ${index < currentDayIndex ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="day-circle">${day.name}</div>
                    <span class="day-name">${day.name}</span>
                `;
                bar.appendChild(item);
            });
        }

        function updateSummary() {
            let cals = 0, protein = 0, carbs = 0, fats = 0;
            mealsData.forEach(m => {
                cals += m.cals;
                protein += m.protein;
                carbs += m.carbs;
                fats += m.fats;
            });

            document.getElementById('totalCals').innerText = cals;
            document.getElementById('remainingCals').innerText = Math.max(0, 1900 - cals);
            document.getElementById('totalProtein').innerText = protein + 'g';
            document.getElementById('totalCarbs').innerText = carbs + 'g';
            document.getElementById('totalFats').innerText = fats + 'g';

            const list = document.getElementById('mealList');
            if (mealsData.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">لا توجد وجبات مضافة اليوم</div>`;
                return;
            }

            list.innerHTML = '';
            mealsData.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = 'meal-item';
                div.innerHTML = `
                    <div class="meal-info">
                        <span class="meal-name">${m.name}</span>
                        <span class="meal-macros">${m.cals} سعرة | P: ${m.protein}g | C: ${m.carbs}g | F: ${m.fats}g</span>
                    </div>
                    <button class="delete-btn" onclick="deleteMeal(${idx})">&times;</button>
                `;
                list.appendChild(div);
            });
        }

        // محاكاة تحليل ذكي مبسط للوجبات المدخلة بناءً على خبرة النظام السابقة
        function parseAndAddMeal() {
            const input = document.getElementById('foodInput').value.trim();
            if (!input) return;

            let cals = 350, protein = 18, carbs = 40, fats = 10;
            let name = input.length > 25 ? input.substring(0, 25) + '...' : input;

            // قواعد ذكاء اصطناعي محلية سريعة للوجبات المشابهة
            if (input.includes('خبز') && input.includes('بيض')) {
                cals = 550; protein = 25; carbs = 65; fats = 12;
            } else if (input.includes('رز') || input.includes('دجاج')) {
                cals = 600; protein = 45; carbs = 70; fats = 8;
            } else if (input.includes('شوفان')) {
                cals = 350; protein = 12; carbs = 55; fats = 7;
            }

            mealsData.push({ name, cals, protein, carbs, fats });
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            
            document.getElementById('foodInput').value = '';
            updateSummary();
        }

        function deleteMeal(index) {
            mealsData.splice(index, 1);
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            updateSummary();
        }

        renderDays();
        updateSummary();
    </script>
</body>
</html>
