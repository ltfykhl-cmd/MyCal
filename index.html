<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCal - متتبع اللياقة والسعرات</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* شريط الأيام الدائري */
        .days-bar {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .day-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .day-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--bg-color);
            border: 2px solid var(--border);
            color: var(--text-muted);
        }

        .day-item.active .day-circle {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .day-item.completed .day-circle {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .day-name {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* الملخص بتصميم الطلب */
        .summary-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cals-main-box {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cals-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .cals-info .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cals-info .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 2px;
        }

        .cals-subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* دائرة النسبة المئوية */
        .progress-ring-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-text {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* شبكة الماكروز */
        .macros-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .macro-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .macro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .macro-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .macro-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .mini-progress {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        .macro-card.full {
            grid-column: span 2;
        }

        /* بطاقات الإدخال */
        .card-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-section h3 {
            font-size: 0.9rem;
            color: var(--accent);
        }

        textarea, input, select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        textarea {
            resize: none;
            height: 65px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        button.primary-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* الوجبات */
        .meal-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .meal-item {
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        .danger-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* النافذة المنسدلة للإعدادات */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MyCal Fitness</h1>
            <button class="settings-btn" onclick="toggleModal(true)">⚙️ تعديل الأهداف</button>
        </header>

        <!-- شريط الأيام -->
        <div class="days-bar" id="daysBar"></div>

        <!-- الملخص بالتصميم المطلوب -->
        <div class="summary-card">
            <div class="cals-main-box">
                <div class="progress-ring-container">
                    <span class="progress-ring-text" id="percentText">0%</span>
                </div>
                <div class="cals-info">
                    <div class="label">المتبقي</div>
                    <div class="value" id="remainingCals">2000</div>
                    <div class="cals-subtext">الهدف: <span id="targetCalsDisplay">2000</span> | المستهلك: <span id="totalCals">0</span></div>
                </div>
            </div>

            <div class="macros-grid">
                <div class="macro-card">
                    <div class="macro-header">
                        <span>بروتين متبقي</span>
                    </div>
                    <div class="macro-value" id="remProtein">130 غ</div>
                    <div class="macro-sub" id="textProtein">0 من 130 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillProtein" style="width: 0%;"></div></div>
                </div>

                <div class="macro-card">
                    <div class="macro-header">
                        <span>كربوهيدرات</span>
                    </div>
                    <div class="macro-value" id="remCarbs">245 غ</div>
                    <div class="macro-sub" id="textCarbs">0 من 245 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillCarbs" style="width: 0%;"></div></div>
                </div>

                <div class="macro-card full">
                    <div class="macro-header">
                        <span>دهون</span>
                    </div>
                    <div class="macro-value" id="remFats">56 غ</div>
                    <div class="macro-sub" id="textFats">0 من 56 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillFats" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>

        <!-- إدخال الوجبات الذكي بالـ AI -->
        <div class="card-section">
            <h3>✨ إدخال وجبة بالذكاء الاصطناعي</h3>
            <textarea id="foodInput" placeholder="اكتب وجبتك (مثلاً: قطعتين خبز قمح 284غ مع 10غ هريسة وبيضتين)..."></textarea>
            <button class="primary-btn" onclick="parseAndAddMeal()">تحليل وإضافة للوحة</button>
        </div>

        <!-- إضافة يدوية -->
        <div class="card-section">
            <h3>+ إضافة وجبة يدوية</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="number" id="manualCals" placeholder="السعرات">
                <input type="number" id="manualProtein" placeholder="بروتين (غ)">
                <input type="number" id="manualCarbs" placeholder="كارب (غ)">
                <input type="number" id="manualFats" placeholder="دهون (غ)">
            </div>
            <button class="primary-btn" onclick="addManualMeal()">إضافة يدوية</button>
        </div>

        <!-- وجبات اليوم -->
        <div class="card-section">
            <h3>وجبات اليوم</h3>
            <div class="meal-list" id="mealList">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>
            </div>
        </div>

        <button class="danger-btn" onclick="resetDay()">تصفير بيانات اليوم</button>
    </div>

    <!-- نافذة تعديل الأهداف -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>تعديل الأهداف المخصصة</span>
                <button class="settings-btn" onclick="toggleModal(false)">&times;</button>
            </div>
            <div class="input-group">
                <label>هدف السعرات الحرارية</label>
                <input type="number" id="setTargetCals">
            </div>
            <div class="input-group">
                <label>هدف البروتين (غرام)</label>
                <input type="number" id="setTargetProtein">
            </div>
            <div class="input-group">
                <label>هدف الكربوهيدرات (غرام)</label>
                <input type="number" id="setTargetCarbs">
            </div>
            <div class="input-group">
                <label>هدف الدهون (غرام)</label>
                <input type="number" id="setTargetFats">
            </div>
            <button class="primary-btn" onclick="saveCustomGoals()">حفظ الأهداف</button>
        </div>
    </div>

    <script>
        const days = [
            { name: 'س' }, { name: 'ح' }, { name: 'ن' }, { name: 'ث' }, { name: 'ر' }, { name: 'خ' }, { name: 'ج' }
        ];

        let currentDayIndex = 1;
        let goals = JSON.parse(localStorage.getItem('mycal_custom_goals') || JSON.stringify({
            cals: 2000, protein: 130, carbs: 245, fats: 56
        }));

        let mealsData = JSON.parse(localStorage.getItem('mycal_meals') || '[]');

        function renderDays() {
            const bar = document.getElementById('daysBar');
            bar.innerHTML = '';
            days.forEach((day, index) => {
                const item = document.createElement('div');
                item.className = `day-item ${index === currentDayIndex ? 'active' : ''} ${index < currentDayIndex ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="day-circle">${day.name}</div>
                    <span class="day-name">${day.name}</span>
                `;
                bar.appendChild(item);
            });
        }

        function updateSummary() {
            let cals = 0, protein = 0, carbs = 0, fats = 0;
            mealsData.forEach(m => {
                cals += m.cals;
                protein += m.protein;
                carbs += m.carbs;
                fats += m.fats;
            });

            let remainingCals = Math.max(0, goals.cals - cals);
            let percent = Math.min(100, Math.round((cals / goals.cals) * 100));

            document.getElementById('remainingCals').innerText = remainingCals;
            document.getElementById('targetCalsDisplay').innerText = goals.cals;
            document.getElementById('totalCals').innerText = cals;
            document.getElementById('percentText').innerText = percent + '%';

            // بروتين
            let remProtein = Math.max(0, goals.protein - protein);
            document.getElementById('remProtein').innerText = remProtein + ' غ';
            document.getElementById('textProtein').innerText = `${protein} من ${goals.protein} غ`;
            document.getElementById('fillProtein').style.width = Math.min(100, (protein / goals.protein) * 100) + '%';

            // كارب
            let remCarbs = Math.max(0, goals.carbs - carbs);
            document.getElementById('remCarbs').innerText = remCarbs + ' غ';
            document.getElementById('textCarbs').innerText = `${carbs} من ${goals.carbs} غ`;
            document.getElementById('fillCarbs').style.width = Math.min(100, (carbs / goals.carbs) * 100) + '%';

            // دهون
            let remFats = Math.max(0, goals.fats - fats);
            document.getElementById('remFats').innerText = remFats + ' غ';
            document.getElementById('textFats').innerText = `${fats} من ${goals.fats} غ`;
            document.getElementById('fillFats').style.width = Math.min(100, (fats / goals.fats) * 100) + '%';

            const list = document.getElementById('mealList');
            if (mealsData.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>`;
                return;
            }

            list.innerHTML = '';
            mealsData.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = 'meal-item';
                div.innerHTML = `
                    <div class="meal-info">
                        <span class="meal-name">${m.name}</span>
                        <span class="meal-macros" style="color: var(--text-muted); font-size: 0.75rem;">${m.cals} سعرة | P: ${m.protein}g | C: ${m.carbs}g | F: ${m.fats}g</span>
                    </div>
                    <button class="delete-btn" onclick="deleteMeal(${idx})">&times;</button>
                `;
                list.appendChild(div);
            });
        }

        function parseAndAddMeal() {
            const input = document.getElementById('foodInput').value.trim();
            if (!input) return;

            let cals = 350, protein = 20, carbs = 40, fats = 10;
            let name = input.length > 22 ? input.substring(0, 22) + '...' : input;

            // الذكاء الاصطناعي للوجبات المطابقة لروتينك (مثل وجبة الخبز والبيض)
            if (input.includes('خبز') && input.includes('بيض')) {
                cals = 870; protein = 36; carbs = 136; fats = 14;
                name = "فطور خبز وبيض وهريسة";
            } else if (input.includes('رز') || input.includes('دجاج')) {
                cals = 600; protein = 45; carbs = 70; fats = 8;
            } else if (input.includes('شوفان')) {
                cals = 350; protein = 12; carbs = 55; fats = 7;
            }

            mealsData.push({ name, cals, protein, carbs, fats });
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            document.getElementById('foodInput').value = '';
            updateSummary();
        }

        function addManualMeal() {
            const cals = parseInt(document.getElementById('manualCals').value) || 0;
            const protein = parseInt(document.getElementById('manualProtein').value) || 0;
            const carbs = parseInt(document.getElementById('manualCarbs').value) || 0;
            const fats = parseInt(document.getElementById('manualFats').value) || 0;

            if (cals === 0) return;

            mealsData.push({ name: 'وجبة يدوية', cals, protein, carbs, fats });
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            
            document.getElementById('manualCals').value = '';
            document.getElementById('manualProtein').value = '';
            document.getElementById('manualCarbs').value = '';
            document.getElementById('manualFats').value = '';
            updateSummary();
        }

        function deleteMeal(index) {
            mealsData.splice(index, 1);
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            updateSummary();
        }

        function resetDay() {
            if (confirm('هل تريد تصفير بيانات وجبات اليوم؟')) {
                mealsData = [];
                localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
                updateSummary();
            }
        }

        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
            if (show) {
                document.getElementById('setTargetCals').value = goals.cals;
                document.getElementById('setTargetProtein').value = goals.protein;
                document.getElementById('setTargetCarbs').value = goals.carbs;
                document.getElementById('setTargetFats').value = goals.fats;
            }
        }

        function saveCustomGoals() {
            goals.cals = parseInt(document.getElementById('setTargetCals').value) || goals.cals;
            goals.protein = parseInt(document.getElementById('setTargetProtein').value) || goals.protein;
            goals.carbs = parseInt(document.getElementById('setTargetCarbs').value) || goals.carbs;
            goals.fats = parseInt(document.getElementById('setTargetFats').value) || goals.fats;

            localStorage.setItem('mycal_custom_goals', JSON.stringify(goals));
            toggleModal(false);
            updateSummary();
        }

        renderDays();
        updateSummary();
    </script>
</body>
</html>
