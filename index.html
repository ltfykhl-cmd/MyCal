<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCal - متتبع اللياقة والسعرات</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* شريط الأيام */
        .days-bar {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .day-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .day-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--bg-color);
            border: 2px solid var(--border);
            color: var(--text-muted);
        }

        .day-item.active .day-circle {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .day-item.completed .day-circle {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .day-name {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* تصميم بطاقة السعرات */
        .summary-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cals-main-box {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cals-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: left;
        }

        .cals-info .title-top {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .cals-info .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1;
        }

        .cals-details-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* دائرة التقدم الاحترافية (SVG Progress Ring) */
        .progress-ring-container {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            transform: rotate(-90deg);
            width: 70px;
            height: 70px;
        }

        .progress-ring__circle-bg {
            fill: none;
            stroke: #1e293b;
            stroke-width: 6;
        }

        .progress-ring__circle {
            fill: none;
            stroke: var(--accent);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.35s ease;
        }

        .progress-ring-text {
            position: absolute;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-main);
        }

        /* شبكة الماكروز */
        .macros-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .macro-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .macro-header {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .macro-value {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .macro-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .mini-progress {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .mini-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        /* بطاقات الإدخال */
        .card-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-section h3 {
            font-size: 0.9rem;
            color: var(--accent);
        }

        textarea, input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        textarea {
            resize: none;
            height: 65px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        button.primary-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* الوجبات */
        .meal-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .meal-item {
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        .danger-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* نافذة الإعدادات */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MyCal Fitness</h1>
            <button class="settings-btn" onclick="toggleModal(true)">⚙️ الإعدادات</button>
        </header>

        <!-- شريط الأيام -->
        <div class="days-bar" id="daysBar"></div>

        <!-- ملخص السعرات مع دائرة التقدم الاحترافية -->
        <div class="summary-card">
            <div class="cals-main-box">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 60 60">
                        <circle class="progress-ring__circle-bg" cx="30" cy="30" r="26"></circle>
                        <circle class="progress-ring__circle" id="progressRingCircle" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"></circle>
                    </svg>
                    <span class="progress-ring-text" id="percentText">0%</span>
                </div>
                <div class="cals-info">
                    <div class="title-top">السعرات المتبقية (<span id="statusLabel">تنشيف</span>)</div>
                    <div class="value" id="remainingCals">1850</div>
                    <div class="cals-details-row">
                        <span>الهدف: <strong id="targetCalsDisplay">1850</strong></span>
                        <span>المستهلك: <strong id="totalCals">0</strong></span>
                    </div>
                </div>
            </div>

            <div class="macros-grid">
                <div class="macro-card">
                    <div class="macro-header">بروتين</div>
                    <div class="macro-value" id="proteinVal">150 غ</div>
                    <div class="macro-sub" id="proteinSub">0 من 150 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillProtein" style="width: 0%;"></div></div>
                </div>

                <div class="macro-card">
                    <div class="macro-header">كربوهيدرات</div>
                    <div class="macro-value" id="carbsVal">210 غ</div>
                    <div class="macro-sub" id="carbsSub">0 من 210 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillCarbs" style="width: 0%;"></div></div>
                </div>

                <div class="macro-card" style="grid-column: span 2;">
                    <div class="macro-header">دهون</div>
                    <div class="macro-value" id="fatsVal">55 غ</div>
                    <div class="macro-sub" id="fatsSub">0 من 55 غ</div>
                    <div class="mini-progress"><div class="mini-progress-fill" id="fillFats" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>

        <!-- تحليل وإضافة الوجبات الذكي مع قاعدة بيانات ضخمة -->
        <div class="card-section">
            <h3>✨ إدخال وجبة ذكي (قاعدة بيانات شاملة)</h3>
            <textarea id="foodInput" placeholder="اكتب وجبتك (مثلاً: 250غ صدر دجاج, 200غ أرز, 3 بيضات, 50غ شوفان)..."></textarea>
            <button class="primary-btn" onclick="parseAndAddMeal()">تحليل وإضافة للوحة</button>
        </div>

        <!-- إضافة يدوية -->
        <div class="card-section">
            <h3>+ إضافة يدوية سريعة</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="number" id="manualCals" placeholder="السعرات">
                <input type="number" id="manualProtein" placeholder="بروتين (غ)">
                <input type="number" id="manualCarbs" placeholder="كارب (غ)">
                <input type="number" id="manualFats" placeholder="دهون (غ)">
            </div>
            <button class="primary-btn" onclick="addManualMeal()">إضافة للوجبات</button>
        </div>

        <!-- قائمة الوجبات -->
        <div class="card-section">
            <h3>وجبات اليوم</h3>
            <div class="meal-list" id="mealList">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>
            </div>
        </div>

        <button class="danger-btn" onclick="resetDay()">تصفير بيانات اليوم</button>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>تعديل الأهداف والماكروز</span>
                <button class="settings-btn" onclick="toggleModal(false)">&times;</button>
            </div>
            <div class="input-group">
                <label>حالة النظام</label>
                <input type="text" id="setStatusText" value="تنشيف">
            </div>
            <div class="input-group">
                <label>هدف السعرات الحرارية</label>
                <input type="number" id="setTargetCals">
            </div>
            <div class="input-group">
                <label>هدف البروتين (غ)</label>
                <input type="number" id="setTargetProtein">
            </div>
            <div class="input-group">
                <label>هدف الكربوهيدرات (غ)</label>
                <input type="number" id="setTargetCarbs">
            </div>
            <div class="input-group">
                <label>هدف الدهون (غ)</label>
                <input type="number" id="setTargetFats">
            </div>
            <button class="primary-btn" onclick="saveCustomGoals()">حفظ التعديلات</button>
        </div>
    </div>

    <script>
        const days = [
            { name: 'س' }, { name: 'ح' }, { name: 'ن' }, { name: 'ث' }, { name: 'ر' }, { name: 'خ' }, { name: 'ج' }
        ];

        let currentDayIndex = 1;
        let goals = JSON.parse(localStorage.getItem('mycal_custom_goals') || JSON.stringify({
            status: 'تنشيف', cals: 1850, protein: 150, carbs: 210, fats: 55
        }));

        let mealsData = JSON.parse(localStorage.getItem('mycal_meals') || '[]');

        // قاعدة بيانات ضخمة وشاملة لكل الأغذية لكل 100 جرام (أو للوحدة القياسية)
        const foodDatabase = {
            // اللحوم والدواجن والأسماك (لكل 100غ مطبوخ/جاهز)
            'دجاج': { cals: 1.65, p: 0.31, c: 0, f: 0.036 },
            'صدر دجاج': { cals: 1.65, p: 0.31, c: 0, f: 0.036 },
            'لحم': { cals: 2.50, p: 0.26, c: 0, f: 0.15 },
            'لحم مفروم': { cals: 2.15, p: 0.25, c: 0, f: 0.12 },
            'تونا': { cals: 1.16, p: 0.26, c: 0, f: 0.01 },
            'تونة': { cals: 1.16, p: 0.26, c: 0, f: 0.01 },
            'سمك': { cals: 1.40, p: 0.22, c: 0, f: 0.05 },
            'جمبري': { cals: 0.99, p: 0.24, c: 0, f: 0.03 },

            // الكارب والحبوب (لكل 100غ مطبوخ أو جاف حسب الشائع)
            'أرز': { cals: 1.30, p: 0.027, c: 0.28, f: 0.003 },
            'رز': { cals: 1.30, p: 0.027, c: 0.28, f: 0.003 },
            'مكرونة': { cals: 1.58, p: 0.058, c: 0.31, f: 0.009 },
            'معكرونة': { cals: 1.58, p: 0.058, c: 0.31, f: 0.009 },
            'شوفان': { cals: 3.89, p: 0.169, c: 0.66, f: 0.069 },
            'خبز': { cals: 2.65, p: 0.09, c: 0.49, f: 0.03 },
            'توست': { cals: 2.60, p: 0.09, c: 0.48, f: 0.03 },
            'بطاطس': { cals: 0.87, p: 0.02, c: 0.20, f: 0.001 },
            'بطاطا': { cals: 0.86, p: 0.016, c: 0.20, f: 0.001 },
            'عدس': { cals: 1.16, p: 0.09, c: 0.20, f: 0.004 },
            'فول': { cals: 1.10, p: 0.076, c: 0.20, f: 0.004 },
            'حمص': { cals: 1.64, p: 0.089, c: 0.27, f: 0.026 },

            // الألبان والبيض (بالوحدة أو 100غ)
            'بيضة': { unit: true, cals: 72, p: 6.3, c: 0.4, f: 4.8 },
            'بيض': { unit: true, cals: 72, p: 6.3, c: 0.4, f: 4.8 },
            'حليب': { cals: 0.61, p: 0.032, c: 0.048, f: 0.033 },
            'زبادي': { cals: 0.60, p: 0.035, c: 0.047, f: 0.033 },
            'لبن': { cals: 0.60, p: 0.032, c: 0.048, f: 0.033 },
            'جبنة': { cals: 3.20, p: 0.25, c: 0.015, f: 0.24 },
            'جبن': { cals: 3.20, p: 0.25, c: 0.015, f: 0.24 },
            'قشطة': { cals: 3.45, p: 0.02, c: 0.03, f: 0.36 },
            'زبدة': { cals: 7.17, p: 0.0085, c: 0.0006, f: 0.81 },

            // الفواكه والخضار
            'موز': { cals: 0.89, p: 0.011, c: 0.23, f: 0.003 },
            'تفاح': { cals: 0.52, p: 0.003, c: 0.14, f: 0.002 },
            'تمر': { cals: 2.82, p: 0.025, c: 0.75, f: 0.004 },
            'مكسرات': { cals: 6.00, p: 0.20, c: 0.20, f: 0.50 },
            'فول سوداني': { cals: 5.67, p: 0.258, c: 0.161, f: 0.49 },
            'عسل': { cals: 3.04, p: 0.003, c: 0.82, f: 0 },
            'زيت زيتون': { cals: 8.84, p: 0, c: 0, f: 1.00 }
        };

        function renderDays() {
            const bar = document.getElementById('daysBar');
            bar.innerHTML = '';
            days.forEach((day, index) => {
                const item = document.createElement('div');
                item.className = `day-item ${index === currentDayIndex ? 'active' : ''} ${index < currentDayIndex ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="day-circle">${day.name}</div>
                    <span class="day-name">${day.name}</span>
                `;
                bar.appendChild(item);
            });
        }

        function updateSummary() {
            let cals = 0, protein = 0, carbs = 0, fats = 0;
            mealsData.forEach(m => {
                cals += m.cals;
                protein += m.protein;
                carbs += m.carbs;
                fats += m.fats;
            });

            let remainingCals = Math.max(0, goals.cals - cals);
            let percent = Math.min(100, Math.round((cals / goals.cals) * 100));

            document.getElementById('statusLabel').innerText = goals.status;
            document.getElementById('remainingCals').innerText = remainingCals;
            document.getElementById('targetCalsDisplay').innerText = goals.cals;
            document.getElementById('totalCals').innerText = cals;
            document.getElementById('percentText').innerText = percent + '%';

            const circle = document.getElementById('progressRingCircle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            document.getElementById('proteinVal').innerText = goals.protein + ' غ';
            document.getElementById('proteinSub').innerText = `${protein} من ${goals.protein} غ`;
            document.getElementById('fillProtein').style.width = Math.min(100, (protein / goals.protein) * 100) + '%';

            document.getElementById('carbsVal').innerText = goals.carbs + ' غ';
            document.getElementById('carbsSub').innerText = `${carbs} من ${goals.carbs} غ`;
            document.getElementById('fillCarbs').style.width = Math.min(100, (carbs / goals.carbs) * 100) + '%';

            document.getElementById('fatsVal').innerText = goals.fats + ' غ';
            document.getElementById('fatsSub').innerText = `${fats} من ${goals.fats} غ`;
            document.getElementById('fillFats').style.width = Math.min(100, (fats / goals.fats) * 100) + '%';

            const list = document.getElementById('mealList');
            if (mealsData.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">لم يتم تسجيل وجبات اليوم بعد</div>`;
                return;
            }

            list.innerHTML = '';
            mealsData.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = 'meal-item';
                div.innerHTML = `
                    <div class="meal-info">
                        <span class="meal-name" style="font-weight: bold;">${m.name}</span>
                        <div class="meal-macros" style="color: var(--text-muted); font-size: 0.75rem; margin-top: 2px;">
                            ${m.cals} سعرة | P: ${m.protein}g | C: ${m.carbs}g | F: ${m.fats}g
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteMeal(${idx})">&times;</button>
                `;
                list.appendChild(div);
            });
        }

        // محرك تحليل ذكي متطور يعتمد على قاعدة البيانات الضخمة
        function parseAndAddMeal() {
            const rawInput = document.getElementById('foodInput').value.trim();
            if (!rawInput) return;

            let totalCals = 0, totalProtein = 0, totalCarbs = 0, totalFats = 0;
            const text = rawInput.toLowerCase();

            // تحليل الجملة عن طريق البحث عن أصناف قاعدة البيانات
            let matched = false;
            for (let key in foodDatabase) {
                if (text.includes(key)) {
                    matched = true;
                    let item = foodDatabase[key];
                    
                    // البحث عن الكمية بجانب اسم الصنف
                    let regex = new RegExp(`(\\d+)\\s*(غ|جم|جرام|مل|ml|شرايح|شريحة|حبات|حبة|بيضات|بيضة)?\\s*(${key})`);
                    let match = text.match(regex);
                    let amount = 100; // الافتراضي
                    
                    if (match && match[1]) {
                        amount = parseInt(match[1]);
                    } else {
                        // محاولة البحث عن أي رقم قبل أو بعد الكلمة بقليل
                        let generalRegex = new RegExp(`(\\d+)[^\\d]*${key}|${key}[^\\d]*(\\d+)`);
                        let genMatch = text.match(generalRegex);
                        if (genMatch) {
                            amount = parseInt(genMatch[1] || genMatch[2] || 100);
                        }
                    }

                    if (item.unit) {
                        // إذا كان صنف يعامل بالوحدة مثل البيض
                        let count = amount > 50 ? Math.round(amount / 50) : amount; // إن كتب 100غ بيض يحولها لحبتين تقريباً
                        totalCals += count * item.cals;
                        totalProtein += Math.round(count * item.p);
                        totalCarbs += Math.round(count * item.c);
                        totalFats += Math.round(count * item.f);
                    } else {
                        // بالجرام أو الملي
                        totalCals += Math.round(amount * item.cals);
                        totalProtein += Math.round(amount * item.p);
                        totalCarbs += Math.round(amount * item.c);
                        totalFats += Math.round(amount * item.f);
                    }
                }
            }

            // إذا لم يتم مطابقة أي صنف بدقة من قاعدة البيانات، نضع تقدير ذكي يحسب بناءً على النص
            if (!matched || totalCals === 0) {
                totalCals = 300;
                totalProtein = 20;
                totalCarbs = 30;
                totalFats = 10;
            }

            let name = rawInput.length > 28 ? rawInput.substring(0, 28) + '...' : rawInput;

            mealsData.push({ name, cals: totalCals, protein: totalProtein, carbs: totalCarbs, fats: totalFats });
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            document.getElementById('foodInput').value = '';
            updateSummary();
        }

        function addManualMeal() {
            const cals = parseInt(document.getElementById('manualCals').value) || 0;
            const protein = parseInt(document.getElementById('manualProtein').value) || 0;
            const carbs = parseInt(document.getElementById('manualCarbs').value) || 0;
            const fats = parseInt(document.getElementById('manualFats').value) || 0;

            if (cals === 0 && protein === 0) return;

            mealsData.push({ name: 'وجبة مخصصة', cals, protein, carbs, fats });
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));

            document.getElementById('manualCals').value = '';
            document.getElementById('manualProtein').value = '';
            document.getElementById('manualCarbs').value = '';
            document.getElementById('manualFats').value = '';
            updateSummary();
        }

        function deleteMeal(index) {
            mealsData.splice(index, 1);
            localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
            updateSummary();
        }

        function resetDay() {
            if (confirm('هل تريد تصفير بيانات وجبات اليوم؟')) {
                mealsData = [];
                localStorage.setItem('mycal_meals', JSON.stringify(mealsData));
                updateSummary();
            }
        }

        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
            if (show) {
                document.getElementById('setStatusText').value = goals.status;
                document.getElementById('setTargetCals').value = goals.cals;
                document.getElementById('setTargetProtein').value = goals.protein;
                document.getElementById('setTargetCarbs').value = goals.carbs;
                document.getElementById('setTargetFats').value = goals.fats;
            }
        }

        function saveCustomGoals() {
            goals.status = document.getElementById('setStatusText').value || 'تنشيف';
            goals.cals = parseInt(document.getElementById('setTargetCals').value) || goals.cals;
            goals.protein = parseInt(document.getElementById('setTargetProtein').value) || goals.protein;
            goals.carbs = parseInt(document.getElementById('setTargetCarbs').value) || goals.carbs;
            goals.fats = parseInt(document.getElementById('setTargetFats').value) || goals.fats;

            localStorage.setItem('mycal_custom_goals', JSON.stringify(goals));
            toggleModal(false);
            updateSummary();
        }

        renderDays();
        updateSummary();
    </script>
</body>
</html>
