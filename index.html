<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كالي - النسخة المطابقة</title>
    <style>
        :root {
            --bg-color: #0f141d;
            --card-bg: #171e2c;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263147;
            --active-blue: #0ea5e9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        /* الهيدر العلوي */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }

        .greeting {
            font-size: 14px;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        .streak-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #fbbf24;
        }

        /* شريط الأيام */
        .days-container {
            margin-bottom: 16px;
        }

        .days-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .days-bar::-webkit-scrollbar { display: none; }

        .day-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 10px;
            text-align: center;
            min-width: 42px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-item.active {
            background-color: var(--active-blue);
            border-color: #38bdf8;
        }

        .day-name { font-size: 11px; color: var(--text-muted); }
        .day-item.active .day-name { color: #e0f2fe; }
        .day-num { font-size: 15px; font-weight: bold; margin-top: 2px; }

        .week-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            text-align: right;
        }

        /* بطاقة السعرات والماكروز */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .calories-section {
            margin-bottom: 14px;
        }

        .calories-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .progress-bar {
            background-color: var(--border-color);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--accent-orange);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* شبكة الماكروز */
        .macros-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .macro-box {
            background-color: #101622;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .macro-title { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .macro-value { font-size: 14px; font-weight: bold; }

        /* تبديل المستهلك والمتبقي */
        .toggle-switch {
            display: flex;
            background-color: #101622;
            border-radius: 10px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* قسم الوجبات */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 24px 0;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        /* زر الإضافة العائم */
        .fab {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            z-index: 10;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 5;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--active-blue);
        }

        /* النافذة المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            border-top: 1px solid var(--border-color);
        }

        .modal-textarea {
            width: 100%;
            background-color: #101622;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            height: 90px;
            margin-top: 10px;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div>
                <h1 class="brand-title">كالي</h1>
                <p class="greeting">مساء الخير، شاي 👋</p>
            </div>
            <div class="streak-badge">
                <span>1</span> ⚡
            </div>
        </div>

        <!-- شريط الأيام -->
        <div class="days-container">
            <div class="days-bar" id="daysBar">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
            <div class="week-label">هذا الأسبوع</div>
        </div>

        <!-- بطاقة السعرات والماكروز -->
        <div class="card">
            <div class="calories-section">
                <div class="calories-header">
                    <span>🔥 السعرات الحرارية</span>
                    <span id="calText">0 / 2,004 kcal</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="calProgress"></div>
                </div>
            </div>

            <div class="macros-grid">
                <div class="macro-box">
                    <div class="macro-title">🥩 البروتين</div>
                    <div class="macro-value" id="proText">0 / 130g</div>
                </div>
                <div class="macro-box">
                    <div class="macro-title">🥑 الدهون</div>
                    <div class="macro-value" id="fatText">0 / 56g</div>
                </div>
                <div class="macro-box">
                    <div class="macro-title">🌾 الكارب</div>
                    <div class="macro-value" id="carbText">0 / 245g</div>
                </div>
            </div>

            <!-- تبديل المستهلك والمتبقي -->
            <div class="toggle-switch">
                <button class="toggle-btn active" id="btnConsumed" onclick="setMode('consumed')">المستهلك</button>
                <button class="toggle-btn" id="btnRemaining" onclick="setMode('remaining')">المتبقي</button>
            </div>
        </div>

        <!-- الوجبات -->
        <div class="section-header">
            <span class="section-title" id="mealsCountTitle">الوجبات (0)</span>
        </div>

        <div id="mealsContainer">
            <div class="empty-state">
                <div class="empty-icon">🍽️</div>
                <div>لا توجد وجبات لهذا اليوم</div>
                <div style="font-size: 12px; margin-top: 4px;">اضغط على زر + لبدء التسجيل</div>
            </div>
        </div>
    </div>

    <!-- زر الإضافة -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <button class="nav-item">
            <span style="font-size: 18px;">⚙️</span>
            <span>الإعدادات</span>
        </button>
        <button class="nav-item">
            <span style="font-size: 18px;">📈</span>
            <span>التحليلات</span>
        </button>
        <button class="nav-item active">
            <span style="font-size: 18px;">🏠</span>
            <span>رئيسية</span>
        </button>
    </div>

    <!-- نافذة الإضافة -->
    <div class="modal" id="mealModal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">سجّل وجبتك</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin: 0;">اكتب وصف وجبتك وسيقوم الذكاء الاصطناعي بحسابها بدقة</p>
            <textarea class="modal-textarea" id="mealInput" placeholder="مثال: صدر دجاج 200غ مع كوب أرز..."></textarea>
            <button class="btn-primary" onclick="addMeal()">تحليل وتسجيل</button>
            <button class="btn-primary" style="background-color: transparent; color: var(--text-muted); margin-top: 4px;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // الأهداف اليومية الثابتة
        const goals = { calories: 2004, protein: 130, fat: 56, carb: 245 };

        // بيانات الأيام (محاكاة للأسبوع)
        let daysData = {
            6: { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] },
            7: { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] },
            8: { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] },
            9: { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] },
            10: { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] }
        };

        let currentDay = 6; // اليوم الافتراضي المختار (الثلاثاء 6)
        let displayMode = 'consumed'; // 'consumed' أو 'remaining'

        // بناء شريط الأيام
        function renderDaysBar() {
            const bar = document.getElementById('daysBar');
            const daysList = [
                { name: 'الأحد', num: 10 },
                { name: 'الإثنين', num: 9 },
                { name: 'الثلاثاء', num: 8 },
                { name: 'الأربعاء', num: 7 },
                { name: 'الثلاثاء', num: 6 },
                { name: 'الإثنين', num: 5 },
                { name: 'الأحد', num: 4 }
            ];

            bar.innerHTML = '';
            daysList.forEach(d => {
                if(!daysData[d.num]) {
                    daysData[d.num] = { consumed: { calories: 0, protein: 0, fat: 0, carb: 0 }, meals: [] };
                }
                const item = document.createElement('div');
                item.className = `day-item ${currentDay === d.num ? 'active' : ''}`;
                item.innerHTML = `<div class="day-name">${d.name}</div><div class="day-num">${d.num}</div>`;
                item.onclick = () => selectDay(d.num);
                bar.appendChild(item);
            });
            updateUI();
        }

        function selectDay(num) {
            currentDay = num;
            renderDaysBar();
        }

        function setMode(mode) {
            displayMode = mode;
            document.getElementById('btnConsumed').className = `toggle-btn ${mode === 'consumed' ? 'active' : ''}`;
            document.getElementById('btnRemaining').className = `toggle-btn ${mode === 'remaining' ? 'active' : ''}`;
            updateUI();
        }

        function updateUI() {
            const data = daysData[currentDay].consumed;

            let cVal = data.calories, pVal = data.protein, fVal = data.fat, cbVal = data.carb;
            let cGoal = goals.calories, pGoal = goals.protein, fGoal = goals.fat, cbGoal = goals.carb;

            if(displayMode === 'remaining') {
                cVal = Math.max(0, cGoal - data.calories);
                pVal = Math.max(0, pGoal - data.protein);
                fVal = Math.max(0, fGoal - data.fat);
                cbVal = Math.max(0, cbGoal - data.carb);
            }

            document.getElementById('calText').innerText = `${cVal} / ${cGoal} kcal`;
            document.getElementById('calProgress').style.width = `${Math.min(100, (data.calories / cGoal) * 100)}%`;

            document.getElementById('proText').innerText = `${pVal} / ${pGoal}g`;
            document.getElementById('fatText').innerText = `${fVal} / ${fGoal}g`;
            document.getElementById('carbText').innerText = `${cbVal} / ${cbGoal}g`;

            // تحديث الوجبات
            const mealsContainer = document.getElementById('mealsContainer');
            const meals = daysData[currentDay].meals;
            document.getElementById('mealsCountTitle').innerText = `الوجبات (${meals.length})`;

            if(meals.length === 0) {
                mealsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div>لا توجد وجبات لهذا اليوم</div>
                        <div style="font-size: 12px; margin-top: 4px;">اضغط على زر + لبدء التسجيل</div>
                    </div>
                `;
            } else {
                mealsContainer.innerHTML = '';
                meals.forEach(m => {
                    mealsContainer.innerHTML += `
                        <div class="card" style="margin-bottom: 8px; padding: 12px;">
                            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:4px; font-size:14px;">
                                <span>${m.title}</span>
                                <span style="color:var(--accent-orange);">🔥 ${m.cal} kcal</span>
                            </div>
                            <div style="font-size:13px; color:var(--text-muted);">${m.desc}</div>
                        </div>
                    `;
                });
            }
        }

        function openModal() { document.getElementById('mealModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('mealModal').style.display = 'none'; }

        function addMeal() {
            const text = document.getElementById('mealInput').value;
            if(!text) return;

            // قيم تجريبية دقيقة للوجبة المسجلة
            daysData[currentDay].consumed.calories += 529;
            daysData[currentDay].consumed.protein += 28;
            daysData[currentDay].consumed.fat += 6;
            daysData[currentDay].consumed.carb += 84;

            daysData[currentDay].meals.push({
                title: 'غداء',
                desc: text,
                cal: 529
            });

            document.getElementById('mealInput').value = '';
            closeModal();
            updateUI();
        }

        // تهيئة الصفحة لأول مرة
        renderDaysBar();
    </script>
</body>
</html>
